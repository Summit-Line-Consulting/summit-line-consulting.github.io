project:
  type: website
  render:
    - index.qmd
    - services.qmd
    - who_is_slc.qmd
    - contact.qmd

website:
  title: "Summit Line Consulting"
  site-url: https://summitlineconsulting.com
  description: "FP&A consulting for growing organizations: budgeting, forecasting, financial modeling and reporting. Based in Fruita, Colorado."
  favicon: images/Favicon_logo.svg
  image: images/Headshot.jpg
  open-graph: true
  search: false
  navbar:
    logo: images/Logo_no_text.svg
    logo-alt: "Summit Line Consulting home"
    title: "Summit Line Consulting"
    right:
      - href: services.qmd
        text: Services
      - href: who_is_slc.qmd
        text: About
      - href: contact.qmd
        text: Contact

format:
  html:
    theme: styles.scss
    toc: false
    page-layout: custom
    title-block-style: none
    anchor-sections: false
    include-after-body: _footer.html

execute:
  freeze: auto
